name: dibobo

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${DIBOBO_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DIBOBO_APP_ENV: ${DIBOBO_APP_ENV:-production}
      DIBOBO_APP_PUBLIC_URL: ${DIBOBO_APP_PUBLIC_URL:-http://localhost:8080}
      DIBOBO_DATABASE_URL: ${DIBOBO_DATABASE_URL:?Set DIBOBO_DATABASE_URL in .env}
      DIBOBO_VALKEY_URL: ${DIBOBO_VALKEY_URL:-redis://valkey:6379/0}
      DIBOBO_SESSION_SECRET: ${DIBOBO_SESSION_SECRET:?Set DIBOBO_SESSION_SECRET in .env}
      DIBOBO_API_KEY_ENCRYPTION_KEY: ${DIBOBO_API_KEY_ENCRYPTION_KEY:?Set DIBOBO_API_KEY_ENCRYPTION_KEY in .env}
      DIBOBO_SESSION_SECURE_COOKIE: ${DIBOBO_SESSION_SECURE_COOKIE:-false}
      DIBOBO_TIMEZONE: ${DIBOBO_TIMEZONE:-Asia/Shanghai}
      DIBOBO_LOG_LEVEL: ${DIBOBO_LOG_LEVEL:-INFO}
      DIBOBO_QUOTE_REFRESH_SECONDS: ${DIBOBO_QUOTE_REFRESH_SECONDS:-5}
      DIBOBO_VALUATION_CACHE_MINUTES: ${DIBOBO_VALUATION_CACHE_MINUTES:-5}
      DIBOBO_UPSTREAM_TIMEOUT_SECONDS: ${DIBOBO_UPSTREAM_TIMEOUT_SECONDS:-8}
      DIBOBO_UPSTREAM_CONCURRENCY: ${DIBOBO_UPSTREAM_CONCURRENCY:-4}
      DIBOBO_AKSHARE_ENABLED: ${DIBOBO_AKSHARE_ENABLED:-true}
      DIBOBO_GLOBAL_MARKET_ENABLED: ${DIBOBO_GLOBAL_MARKET_ENABLED:-false}
      DIBOBO_GLOBAL_MARKET_GROUP_STAGGER_SECONDS: ${DIBOBO_GLOBAL_MARKET_GROUP_STAGGER_SECONDS:-5}
      HTTP_PROXY: ${DIBOBO_HTTP_PROXY:-}
      HTTPS_PROXY: ${DIBOBO_HTTPS_PROXY:-}
      NO_PROXY: ${DIBOBO_NO_PROXY:-localhost,127.0.0.1,postgres,valkey}
      DIBOBO_GLOBAL_MARKET_REFRESH_SECONDS: ${DIBOBO_GLOBAL_MARKET_REFRESH_SECONDS:-10}
      DIBOBO_GLOBAL_MARKET_COMMODITY_REFRESH_SECONDS: ${DIBOBO_GLOBAL_MARKET_COMMODITY_REFRESH_SECONDS:-8}
      DIBOBO_GLOBAL_MARKET_YIELD_REFRESH_SECONDS: ${DIBOBO_GLOBAL_MARKET_YIELD_REFRESH_SECONDS:-86400}
      DIBOBO_GLOBAL_MARKET_FRESH_SECONDS: ${DIBOBO_GLOBAL_MARKET_FRESH_SECONDS:-120}
      DIBOBO_GLOBAL_MARKET_DELAYED_SECONDS: ${DIBOBO_GLOBAL_MARKET_DELAYED_SECONDS:-600}
      DIBOBO_GLOBAL_MARKET_RETENTION_SECONDS: ${DIBOBO_GLOBAL_MARKET_RETENTION_SECONDS:-2592000}
      DIBOBO_GLOBAL_MARKET_TIMEOUT_SECONDS: ${DIBOBO_GLOBAL_MARKET_TIMEOUT_SECONDS:-30}
      DIBOBO_GLOBAL_MARKET_QUALITY_PROFILE: ${DIBOBO_GLOBAL_MARKET_QUALITY_PROFILE:-global-market-v1}
      DIBOBO_LOGIN_FAILURE_LIMIT: ${DIBOBO_LOGIN_FAILURE_LIMIT:-5}
      DIBOBO_LOGIN_LOCK_SECONDS: ${DIBOBO_LOGIN_LOCK_SECONDS:-300}
      DIBOBO_INITIAL_USERNAME: ${DIBOBO_INITIAL_USERNAME:-}
      DIBOBO_INITIAL_PASSWORD: ${DIBOBO_INITIAL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dibobo}
      POSTGRES_USER: ${POSTGRES_USER:-dibobo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${DIBOBO_TIMEZONE:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dibobo} -d ${POSTGRES_DB:-dibobo}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
